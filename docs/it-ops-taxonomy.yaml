        origin: connector
        connectors: 15
        frameworks: [ITIL Service Desk, ITIL Request]
        subdomains: [auto_deflection, classification_routing, l0_l1_autoresolve, ticket_enrichment, sla_breach, major_incident, approval_workflows, reassignment_churn, conversational_status, knowledge_deflection]
      - name: Incident Management
        origin: fill
        frameworks: [ITIL Incident, NIST RS]
        subdomains: [sev_classify, war_room, customer_comms, timeline, page_storm, commander_role, handoff, major_incident_bridge]
      - name: Problem Management
        origin: fill
        frameworks: [ITIL Problem]
        subdomains: [rca, known_error, workaround, problem_trend, ke_article, recurring_incident]
      - name: Change Enablement
        origin: fill
        frameworks: [ITIL Change, Gartner ARO]
        subdomains: [cab_risk, emergency_change, backout_plan, collision_window, standard_change, post_impl_verify, freeze_calendar]
      - name: Request Catalog
        origin: fill
        frameworks: [ITIL Request, ITIL Catalog]
        subdomains: [catalog_item, fulfillment_path, entitlement, approval_chain, service_offering, request_sla]
      - name: CMDB Configuration
        origin: fill
        frameworks: [ITIL Configuration, ServiceNow CSDM]
        subdomains: [ci_reconciliation, relationship_map, stale_ci, discovery_gap, service_mapping, orphan_ci]
      - name: Knowledge Management
