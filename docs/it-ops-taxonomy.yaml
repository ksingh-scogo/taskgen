# Scogo IT Ops compositional prompt-seed taxonomy v2
# Built 2026-08-17 from: Scogo connector categories, Scogo use-case catalogue,
# ITIL 4 (34 practices), NIST CSF 2.0, Gartner ITSM/ITOM/ITAM + Observability,
# CSOH 2026 security umbrellas (CNAPP/SSE/XDR/ASPM/DSPM/SSPM).
# OEM/ISV category added 2026-08-17 as a vendor-first sampling axis.
#
# category  = taskgen Args --distribution key
# domain    = DomainDef.name
# subdomains = DomainDef.subdomains (snake_case operational scenarios,
#              except oem where they are product lines)
#
# origin:
#   connector  — named in Scogo product integration categories (screenshot)
#   catalogue  — Scogo use-case catalogue / scogo.ai, no connector bucket
#   fill       — ITIL / NIST / Gartner / market gap; needed for full-estate SFT

schema_version: scogo.taskgen.taxonomy.v2
id: scogo-itops-v4
kind: compositional
label: Scogo IT Operations
