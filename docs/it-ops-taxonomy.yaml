categories:
  - id: itsm
    weight: 0.10
    label: ITSM & Service Management
    pillar: Gartner ITSM · ITIL service practices
    blurb: System of record for request, incident, problem, change, knowledge, CMDB, SLA.
    eligibility:
      platform_groups: [itsm_cmdb, collaboration]
      environments: [on_premises, hybrid, saas_tenant, remote_work]
      evidence_bundles: [ticket_cmdb, runbook_change_history, logs_metrics_traces, user_reports, multi_source, intentionally_missing]
    domains:
      - id: service_desk
        label: Service Desk
        origin: connector
