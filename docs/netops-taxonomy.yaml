# Scogo Sovereign Enterprise NetOps prompt-seed taxonomy.
# Enterprise networking only; telecom-provider network operations are excluded.
schema_version: scogo.taskgen.taxonomy.v2
id: scogo-enterprise-netops-v2
kind: compositional
label: Scogo Sovereign Enterprise NetOps

scope:
  include:
    - enterprise campus branch data-center cloud hybrid and multicloud networking
    - Kubernetes edge OT IoT AI HPC and enterprise real-time networking
    - read-only investigation evidence interpretation safe change verification rollback abstention and escalation
  exclude:
    - 3GPP RAN EPC 5GC IMS and mobile spectrum planning
    - carrier OSS/BSS carrier optical backbone and service-provider core operations
    - certification-question generation as the primary task objective

defaults:
  system_prompt_file: ../prompts/netops-taskgen-system-v2.txt
  review_system_prompt_file: ../prompts/netops-prompt-review-system-v2.txt
  difficulty_distribution:
    1: 0.02
    2: 0.03
    3: 0.08
    4: 0.12
    5: 0.18
    6: 0.18
    7: 0.15
    8: 0.12
    9: 0.07
    10: 0.05

